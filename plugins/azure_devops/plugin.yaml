schemaVersion: 2
id: azure_devops
title: Azure DevOps
description: Sync Azure DevOps work items into Ajour's local backlog and update estimates from Ajour, and bring in your pull requests.
author:
  name: Alex Trépanier
  url: https://github.com/alextrepa
license:
  name: MIT License
  spdxId: MIT
  url: https://github.com/les-cabochons/ajour-plugins/blob/main/plugins/azure-devops/LICENSE
website: https://github.com/les-cabochons/ajour-plugins/tree/main/plugins/azure-devops#readme
repository:
  provider: github
  slug: les-cabochons/ajour-plugins
  url: https://github.com/les-cabochons/ajour-plugins
status: available
compatibility:
  pluginApiVersion: 3
capabilities:
  - connector
  - codeHost
features:
  - work-item-sync
  - estimate-update
  - pull-requests
install:
  method: github-release
  allowPrereleases: true
  assetPattern: '^azure_devops-[0-9][0-9A-Za-z.+-]*\.ajour-connector$'
tags:
  - azure-devops
  - project-management
  - synchronization

