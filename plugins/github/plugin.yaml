schemaVersion: 2
id: github
title: GitHub
description: Sync GitHub pull requests you authored or were asked to review into Ajour.
author:
  name: Alex Trépanier
  url: https://github.com/alextrepa
license:
  name: MIT License
  spdxId: MIT
  url: https://github.com/les-cabochons/ajc-github/blob/main/LICENSE
website: https://github.com/les-cabochons/ajc-github#readme
repository:
  provider: github
  slug: les-cabochons/ajc-github
  url: https://github.com/les-cabochons/ajc-github
status: available
compatibility:
  pluginApiVersion: 2
capabilities:
  - codeHost
features:
  - pull-requests
install:
  method: github-release
  allowPrereleases: true
  assetPattern: '^github-[0-9A-Za-z.+-]+\.ajour-connector$'
tags:
  - github
  - code-review
  - pull-requests
