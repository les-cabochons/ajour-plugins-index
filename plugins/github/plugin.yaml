schemaVersion: 2
id: github
title: GitHub
description: Bring your GitHub issues into Ajour's backlog, and the pull requests you wrote or were asked to review.
author:
  name: Alex Trépanier
  url: https://github.com/alextrepa
license:
  name: MIT License
  spdxId: MIT
  url: https://github.com/les-cabochons/ajour-plugins/blob/main/plugins/github/LICENSE
website: https://github.com/les-cabochons/ajour-plugins/tree/main/plugins/github#readme
repository:
  provider: github
  slug: les-cabochons/ajour-plugins
  url: https://github.com/les-cabochons/ajour-plugins
status: available
compatibility:
  pluginApiVersion: 3
capabilities:
  - connector
  - codeHost
features:
  - work-item-sync
  - pull-requests
install:
  method: github-release
  allowPrereleases: true
  assetPattern: '^github-[0-9][0-9A-Za-z.+-]*\.ajour-connector$'
tags:
  - github
  - code-review
  - pull-requests
